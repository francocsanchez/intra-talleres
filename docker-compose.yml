services:
  app:
    container_name: intra-talleres-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3012}:3012"
    environment:
      NODE_ENV: production
      PORT: 3012
      HOSTNAME: 0.0.0.0
      # URL pública real de esta app para los returnTo de Auth Central.
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3012}
      # Dentro del contenedor, si Auth Central corre en el host usar host.docker.internal.
      CENTRAL_AUTH_URL: ${CENTRAL_AUTH_URL:-http://host.docker.internal:3100}
      # Debe coincidir con el appKey habilitado en Auth Central.
      CENTRAL_APP_KEY: ${CENTRAL_APP_KEY:-intra-talleres}
      MONGODB_URI: ${MONGODB_URI:-mongodb://host.docker.internal:27017/intra_talleres}
      MONGODB_DB: ${MONGODB_DB:-intra_talleres}
      DBHOST_NIC: ${DBHOST_NIC:-host.docker.internal}
      DBPORT_NIC: ${DBPORT_NIC:-1433}
      DATABASE_NIC: ${DATABASE_NIC:-siac}
      DBUSER_NIC: ${DBUSER_NIC:-sa}
      DBPASS_NIC: ${DBPASS_NIC:-change-this-sql-password}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - intra-talleres-net

networks:
  intra-talleres-net:
    driver: bridge
